<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIに教えてもらった</title>
<meta name="description" content="AIとの会話を、そのままの見た目で残しておくブログ">
<meta name="theme-color" content="#0f1214">
<meta property="og:title" content="AIに教えてもらった">
<meta property="og:description" content="AIとの会話を、そのままの見た目で残しておくブログ">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><line x1="16" y1="5.5" x2="16" y2="9.5" stroke="#1b1f23" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="5" r="1.9" fill="#1b1f23"/><rect x="5.6" y="13.4" width="2.6" height="5.2" rx="1.3" fill="#1b1f23"/><rect x="23.8" y="13.4" width="2.6" height="5.2" rx="1.3" fill="#1b1f23"/><rect x="8" y="9.5" width="16" height="13.5" rx="4.5" fill="#1b1f23"/><circle cx="12.7" cy="15.3" r="1.9" fill="#e8c96a"/><circle cx="19.3" cy="15.3" r="1.9" fill="#e8c96a"/><path d="M12.8 19.3q3.2 2 6.4 0" stroke="#e8c96a" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span class="brand-title">AIに教えてもらった</span></a>
    <p class="brand-desc">AIとの会話を、そのままの見た目で残しておくブログ</p>
  </div>
</header>
<main class="wrap layout">
  <section class="posts" aria-labelledby="posts-heading">
    <div class="posts-head">
      <h2 id="posts-heading">会話ログ</h2>
      <span id="result-count" class="result-count" aria-live="polite"></span>
    </div>
    <div id="active-filters" class="active-filters" hidden></div>
    <ol id="post-list" class="post-list"></ol>
    <p id="empty" class="empty" hidden>条件に合う会話はありません。</p>
  </section>

  <aside class="sidebar" aria-label="絞り込み">
    <section class="panel" aria-labelledby="cal-heading">
      <h2 id="cal-heading">カレンダー</h2>
      <div class="cal-head">
        <button type="button" class="cal-nav" id="cal-prev" aria-label="前の月">‹</button>
        <span class="cal-title" id="cal-title"></span>
        <button type="button" class="cal-nav" id="cal-next" aria-label="次の月">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <p class="cal-note">色のついた日は会話があった日。クリックでその日に絞り込めます。</p>
    </section>

    <section class="panel" aria-labelledby="search-heading">
      <h2 id="search-heading">タグ・キーワード検索</h2>
      <label class="search-box">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="visually-hidden">検索</span>
        <input id="search" class="search-input" type="search" placeholder="タグやタイトルで検索…" autocomplete="off">
      </label>
      <ul id="tag-cloud" class="tags tag-cloud" aria-label="タグ"></ul>
    </section>
  </aside>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p id="ai-credit">会話の相手：どらちゃん（Claude Opus 5.5 via OpenClaw）</p>
    <p>© Ryota Murakami · 会話はできるだけ原文のまま残しています · <a href="https://github.com/ryota-murakami/ai-taught-me">GitHub</a></p>
  </div>
</footer>
<script src="assets/md.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
